name: API dump (yarn 1.21.11)

on:
  push:
    paths:
      - '.api-dump-trigger'
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Resolve remapped minecraft jar (named)
        run: |
          set -o pipefail
          cat > /tmp/initcp.gradle <<'EOF'
allprojects {
    tasks.register('printCompileCp') {
        doLast { println "CP=" + sourceSets.main.compileClasspath.asPath }
    }
}
EOF
          CP=$(gradle -I /tmp/initcp.gradle printCompileCp --no-daemon --console=plain -q 2>/dev/null | grep "^CP=" | head -1 | cut -d= -f2-)
          JAR=$(echo "$CP" | tr ':' '\n' | grep -E "minecraft.*\.jar$" | grep -vE "sources" | head -1)
          echo "JAR=$JAR" | tee jar.path
          [ -n "$JAR" ] || (echo "CP=$CP" && find ~/.gradle/caches/fabric-loom -name "*.jar" | head -50)

      - name: Dump signatures
        run: |
          set -o pipefail
          JAR=$(grep JAR= jar.path | cut -d= -f2)
          CLASSES="net.minecraft.entity.Entity net.minecraft.entity.LivingEntity net.minecraft.entity.player.PlayerEntity net.minecraft.entity.player.PlayerInventory net.minecraft.entity.ItemEntity net.minecraft.entity.decoration.EndCrystalEntity net.minecraft.item.ItemStack net.minecraft.item.Item net.minecraft.item.Items net.minecraft.component.DataComponentTypes net.minecraft.client.MinecraftClient net.minecraft.client.network.ClientPlayerInteractionManager net.minecraft.client.network.PlayerListEntry net.minecraft.client.option.KeyBinding net.minecraft.client.render.Camera net.minecraft.client.render.EntityRenderDispatcher net.minecraft.client.render.Tessellator net.minecraft.client.render.BufferBuilder net.minecraft.client.render.RenderSystem net.minecraft.client.render.VertexFormat net.minecraft.client.render.VertexRendering net.minecraft.client.render.WorldRenderer net.minecraft.client.gui.DrawContext net.minecraft.client.gl.Framebuffer net.minecraft.client.gui.screen.DownloadingTerrainScreen net.minecraft.network.packet.c2s.play.PlayerPositionC2SPacket net.minecraft.network.packet.c2s.play.PlayerInteractItemC2SPacket net.minecraft.network.packet.c2s.play.PlayerInteractEntityC2SPacket net.minecraft.network.packet.s2c.play.EntityPositionS2CPacket net.minecraft.enchantment.EnchantmentHelper net.minecraft.entity.effect.StatusEffectInstance net.minecraft.client.render.entity.EntityRenderer net.minecraft.client.render.item.HeldItemRenderer net.minecraft.client.texture.LightmapTextureManager net.minecraft.client.particle.ParticleManager net.minecraft.world.explosion.Explosion net.minecraft.client.gui.screen.Screen net.minecraft.text.TextVisitFactory net.minecraft.client.render.GameRenderer net.minecraft.client.render.RenderPipelines net.minecraft.client.render.RenderPipeline net.minecraft.client.util.SkinTextures net.minecraft.client.util.math.MatrixStack net.minecraft.client.render.VertexConsumerProvider net.minecraft.client.render.VertexConsumer net.minecraft.network.packet.c2s.common.ResourcePackC2SPacket net.minecraft.network.packet.s2c.common.ResourcePackS2CPacket"
          {
            echo "# yarn 1.21.11 javap dump"
            for c in $CLASSES; do
              echo ""
              echo "===================== $c"
              javap -classpath "$JAR" "$c" 2>&1 || true
            done
            echo ""
            echo "===================== InnerClass search: PlayerInteractEntityC2SPacket"
            unzip -l "$JAR" | grep -i "PlayerInteractEntityC2SPacket"
            echo "===================== Search: terrain screen"
            unzip -l "$JAR" | grep -iE "Terrain|LevelLoading" || true
            echo "===================== Search: sword/pickaxe/armor items"
            unzip -l "$JAR" | grep -iE "item/(Sword|Pickaxe|Armor|Tool|Mining)Item" || true
            echo "===================== Search: ShaderProgram remnants"
            unzip -l "$JAR" | grep -iE "gl/(Shader|GlProgram|GlUniform|ShaderStage)" || true
            echo "===================== Search: Attackable"
            unzip -l "$JAR" | grep -i "Attackable" || true
          } > /tmp/api-dump.txt 2>&1
          tail -100 /tmp/api-dump.txt

      - name: Commit dump
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci
          cp /tmp/api-dump.txt ci/api-dump.txt
          git add ci/api-dump.txt
          git commit -m "ci: api dump [skip ci]" || { echo "nothing to commit"; exit 0; }
          BRANCH="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" && git rebase origin/"$BRANCH" && git push origin HEAD:"$BRANCH" && exit 0
            echo "push race, retry $i"; sleep 10
          done
          exit 1
