name: Jar to branch

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip until 1.21.11 toolchain lands
        run: |
          if ! grep -q "1.21.11" gradle.properties; then
            echo "not on 1.21.11 - skipping"
            exit 0
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon --console=plain

      - name: Commit jar to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci/artifacts
          rm -f ci/artifacts/*.jar
          for j in build/libs/*.jar; do
            case "$j" in *-sources.jar) continue;; esac
            cp "$j" ci/artifacts/
          done
          ls -la ci/artifacts
          git add -f ci/artifacts
          git commit -m "ci: jar artifact [skip ci]" || { echo "nothing to commit"; exit 0; }
          BRANCH="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" && git rebase origin/"$BRANCH" && git push origin HEAD:"$BRANCH" && exit 0
            echo "push race, retry $i"; sleep 10
          done
          exit 1
