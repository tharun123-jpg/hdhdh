name: Migrate mappings (yarn 1.20.1 -> 1.21.11)

on:
  push:
    paths:
      - '.migrate-trigger'
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Migrate sources (migrateMappings)
        run: |
          set -o pipefail
          gradle migrateMappings --mappings "1.21.11+build.5" --input src/main/java --output migratedSrc --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle-migrate.log

      - name: Migrate access widener (best effort)
        run: |
          gradle migrateClassTweakerMappings --mappings "1.21.11+build.5" --no-daemon --console=plain 2>&1 | tee -a /tmp/gradle-migrate.log || echo "AW migration failed, will fix manually" | tee -a /tmp/gradle-migrate.log

      - name: Replace sources with migrated output
        run: |
          rm -rf src/main/java
          mkdir -p src/main/java
          cp -r migratedSrc/* src/main/java/
          rm -rf migratedSrc

      - name: Commit results and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci
          cp /tmp/gradle-migrate.log ci/migrate-log.txt || echo "no log captured" > ci/migrate-log.txt
          git add -A
          if [ "${{ job.status }}" = "success" ]; then
            git rm -q --ignore-unmatch .migrate-trigger || true
          fi
          git commit -m "ci: mapping migration result [skip ci]" || { echo "nothing to commit"; exit 0; }
          BRANCH="${GITHUB_REF#refs/heads/}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH" && git rebase origin/"$BRANCH" && git push origin HEAD:"$BRANCH" && exit 0
            echo "push race, retry $i"; sleep 10
          done
          exit 1
