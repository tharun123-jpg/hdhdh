name: Migrate mappings (yarn 1.20.1 -> 1.21.11)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Migrate sources (migrateMappings)
        run: gradle migrateMappings --mappings "1.21.11+build.5" --input src/main/java --output migratedSrc --no-daemon --console=plain --stacktrace

      - name: Migrate access widener (best effort)
        run: gradle migrateClassTweakerMappings --mappings "1.21.11+build.5" --no-daemon --console=plain || echo "AW migration failed, will fix manually"

      - name: Replace sources with migrated output
        run: |
          rm -rf src/main/java
          mkdir -p src/main/java
          cp -r migratedSrc/* src/main/java/
          rm -rf migratedSrc

      - name: Commit migrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate sources to yarn 1.21.11+build.5 (loom migrateMappings)" || echo "nothing to commit"
          git push
