name: Build

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip until 1.21.11 toolchain lands
        run: |
          if ! grep -q "1.21.11" gradle.properties; then
            echo "gradle.properties is not on 1.21.11 yet - skipping build"
            exit 0
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Prestige-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Commit build log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci
          cp /tmp/gradle-build.log ci/build-log.txt || echo "no log captured" > ci/build-log.txt
          git add ci/build-log.txt
          git commit -m "ci: build log [skip ci]" || echo "nothing to commit"
          git push
