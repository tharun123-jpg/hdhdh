name: Build (1.21.11)

on:
  workflow_dispatch:
  # push trigger is enabled once the 1.21.11 toolchain lands
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon --console=plain --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Prestige-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
