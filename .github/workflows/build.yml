name: Build

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip until 1.21.11 toolchain lands
        run: |
          if ! grep -q "1.21.11" gradle.properties; then
            echo "gradle.properties is not on 1.21.11 yet - skipping build"
            exit 0
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon --console=plain --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Prestige-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
